name: Market Data Update

on:
  schedule:
    # Saat başı (Türkiye saati 00:00–23:00)
    - cron: '0 21-23,0-20 * * *'
    
    # Ekstra 23:50 Türkiye
    - cron: '50 20 * * *'

  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

     - name: Install dependencies
       run: |
         pip install -r requirements.txt
         python -m playwright install chromium

      - name: Run Investing Script
        run: python Dunyaborsa.py

      - name: Run Yahoo Script
        run: python Emtia.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add *.txt
          git commit -m "Auto update market data" || echo "No changes"
          git push
